<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout — FreshCart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="checkout"><div id="site-header"></div><main class="container page-shell"><div class="page-title"><span class="eyebrow">ALMOST THERE</span><h1>Checkout</h1><p>Where should we bring the good stuff?</p></div><div id="checkout-content" class="checkout-layout"><form id="checkout-form" class="checkout-form" novalidate><h2>Delivery details</h2><p class="muted">Add an address for this demo order.</p><div class="form-grid"><div class="field-wrap full"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" required minlength="2" placeholder="e.g. Aanya Sharma"><span class="field-error"></span></div><div class="field-wrap"><label for="phone">Phone number</label><input id="phone" name="phone" inputmode="numeric" autocomplete="tel" required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number"><span class="field-error"></span></div><div class="field-wrap"><label for="pin">PIN code</label><input id="pin" name="pin" inputmode="numeric" autocomplete="postal-code" required pattern="[0-9]{6}" maxlength="6" placeholder="6-digit PIN"><span class="field-error"></span></div><div class="field-wrap full"><label for="address">House / flat and street</label><textarea id="address" name="address" rows="3" autocomplete="street-address" required minlength="8" placeholder="House number, building, street, area"></textarea><span class="field-error"></span></div><div class="field-wrap full"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required minlength="2" placeholder="Your city"><span class="field-error"></span></div></div><p class="demo-note"><i class="bi bi-shield-check"></i> Demo checkout only. No payment details are collected.</p><button class="btn btn-green checkout-submit" type="submit">Place demo order <i class="bi bi-arrow-right"></i></button></form><aside id="checkout-summary" class="summary-card"></aside></div><div id="order-confirmation" class="confirmation-card d-none"></div></main><div id="site-footer"></div><div id="toast-region" class="toast-region" aria-live="polite"></div><script src="js/products.js"></script><script src="js/app.js"></script><script src="js/checkout.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
